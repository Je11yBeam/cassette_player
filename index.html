<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cassette Player</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cassette">
<meta name="theme-color" content="#1d2633">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Playfair+Display:wght@600&family=Caveat:wght@600&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: one portrait player body filling the screen. Blue shell on the left with the cassette window, silver control strip on the right with four orange buttons. Deliberately single-look (the player's own colors), so no dark theme. */
:root {
  --shell: #5b7aa0;
  --shell-dark: #3f5a7c;
  --shell-line: #2f4866;
  --silver: #a9b0b8;
  --silver-hi: #c9ced4;
  --silver-lo: #8a929c;
  --orange: #f08a24;
  --orange-hi: #ffad5c;
  --orange-lo: #c76a12;
  --tape-black: #151313;
  --label: #fbf8f0;
  --reel: #e6e6e6;
  --ink: #2a2a2a;
  --page: #1d2633;
  --serif: "Playfair Display", Georgia, "Times New Roman", serif;
  --round: "Fredoka", "Arial Rounded MT Bold", system-ui, sans-serif;
  --hand: "Caveat", "Bradley Hand", cursive;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
html { background: var(--page); }
body {
  background: var(--page);
  color: var(--silver);
  display: flex; align-items: center; justify-content: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
  box-sizing: border-box;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none; -webkit-user-select: none;
}
.player {
  height: 100%;
  max-height: 912px;
  aspect-ratio: 420 / 912;   /* iPhone Air portrait proportion */
  max-width: 100%;
  display: grid;
  grid-template-columns: 1fr 22%;
  border-radius: 28px;
  overflow: hidden;
  box-shadow: 0 20px 50px rgb(0 0 0 / .45);
}
/* On a phone the player IS the screen: edge to edge, under the status bar and home indicator. */
@media (max-width: 600px), (display-mode: standalone) {
  html, body { background: linear-gradient(90deg, var(--shell) 0 78%, var(--silver) 78%); }
  body { padding: 0; display: block; }
  .player {
    width: 100vw; height: 100vh; height: 100dvh;
    max-height: none; aspect-ratio: auto;
    border-radius: 0; box-shadow: none;
  }
  .shell { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); box-sizing: border-box; }
  .shell::before { top: calc(env(safe-area-inset-top, 0px) + 5%); }
  .strip { padding-bottom: env(safe-area-inset-bottom, 0px); box-sizing: border-box; }
}
.shell {
  background: linear-gradient(180deg, var(--shell) 0%, #5676a0 60%, var(--shell-dark) 100%);
  border-right: 2px solid var(--shell-line);
  position: relative;
  display: grid;
  grid-template-rows: 7% auto 1fr auto auto;
  container-type: size;
  overflow: hidden;
}
.shell::before { /* the seam line near the top, as in the mockup */
  content: ""; position: absolute; left: 0; right: 0; top: 7%;
  border-top: 1.5px solid var(--shell-line);
  box-shadow: 0 1px 0 rgb(255 255 255 / .12);
}
.brand {
  font-family: var(--serif);
  font-size: 11cqw;
  letter-spacing: .04em;
  color: var(--silver-hi);
  text-shadow: 0 1px 0 rgb(0 0 0 / .35), 0 -1px 0 rgb(255 255 255 / .25);
  margin: 4cqh 0 0 8cqw;
}
.bay { position: relative; display: flex; align-items: center; }
.cassette {
  margin-left: 14cqw;
  width: 46cqw; height: 46cqh; max-height: 100%;
  display: grid; grid-template-columns: 30% 70%;
  border-radius: 2px;
  box-shadow: 0 6px 14px rgb(0 0 0 / .35);
  transition: transform .5s cubic-bezier(.3,.7,.3,1);
}
.cassette { cursor: pointer; }
.cassette:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
.cassette.empty .body { opacity: .35; }
.cassette.out { transform: translateX(-130%) rotate(-6deg); }
.label {
  background: var(--label);
  border-right: 1px solid #ddd6c6;
  position: relative;
  display: flex; align-items: center; justify-content: center;
}
.label::before { content: ""; position: absolute; top: 0; bottom: 0; left: 42%; border-left: 1px solid #d9d2c2; }
.label { gap: 3cqw; flex-direction: row-reverse; }
.label small {
  writing-mode: vertical-rl;
  font-family: system-ui, sans-serif;
  font-size: 3.4cqw;
  color: #555;
  white-space: nowrap; overflow: hidden; max-height: 92%; text-overflow: ellipsis;
  position: relative;
}
.label span {
  writing-mode: vertical-rl;
  font-family: var(--hand);
  font-size: 6.5cqw;
  color: #3b4e8a;
  white-space: nowrap;
}
.body {
  background: var(--tape-black);
  display: grid; grid-template-rows: 1fr auto 1fr;
  justify-items: center; align-items: center;
  padding: 8% 0;
}
.reel {
  width: 70%; aspect-ratio: 1; border-radius: 50%;
  background: radial-gradient(circle, #fff 0 18%, var(--reel) 19% 100%);
  box-shadow: inset 0 0 0 3px #cfcfcf;
  position: relative;
}
.reel i {
  position: absolute; inset: 0; margin: auto;
  width: 12%; height: 22%; background: #bdbdbd; border-radius: 2px;
}
.reel i:nth-child(1) { transform: rotate(0deg) translateY(-140%); }
.reel i:nth-child(2) { transform: rotate(60deg) translateY(-140%); }
.reel i:nth-child(3) { transform: rotate(120deg) translateY(-140%); }
.reel i:nth-child(4) { transform: rotate(180deg) translateY(-140%); }
.reel i:nth-child(5) { transform: rotate(240deg) translateY(-140%); }
.reel i:nth-child(6) { transform: rotate(300deg) translateY(-140%); }
.window {
  width: 46%; height: 9cqh;
  background: linear-gradient(90deg, #2e2626, #3a3030);
  border-radius: 2px; position: relative; overflow: hidden;
}
.window::before { /* visible tape */
  content: ""; position: absolute; left: 0; right: 0; top: 14%; height: 34%;
  background: #eee; border-radius: 0 0 50% 50% / 0 0 100% 100%;
}
.window::after { /* tick marks */
  content: ""; position: absolute; left: 50%; top: 8%; bottom: 8%; width: 1px;
  background: repeating-linear-gradient(180deg, #888 0 1px, transparent 1px 8px);
  box-shadow: -3px 0 0 transparent;
}
@keyframes spin { to { transform: rotate(360deg); } }
.playing .reel { animation: spin 2.4s linear infinite; }
.ffwd .reel { animation: spin .35s linear infinite; }
.rew .reel { animation: spin .35s linear infinite reverse; }

.door {
  position: absolute; right: 0; top: 50%; transform: translateY(-50%);
  width: 24cqw; height: 22cqh;
  display: grid; place-items: center;
}
/* Arrow pressed into the shell itself: dark groove plus a light lower edge, no separate panel */
.door svg { width: 42%; overflow: visible; transition: transform .3s; }
.door .groove { stroke: rgb(20 35 55 / .55); }
.door .lip { stroke: rgb(255 255 255 / .28); transform: translate(0, 1.4px); }
.cassette.out ~ .door svg { transform: rotate(-90deg); transition: transform .3s; }

/* Now-playing display: a small backlit LCD set into the shell */
.lcd {
  margin: 2.5cqh 8cqw 3cqh;
  padding: 1.6cqh 4cqw;
  border-radius: 6px;
  background: linear-gradient(180deg, #1c2a22, #22352a);
  box-shadow: inset 0 2px 4px rgb(0 0 0 / .55), 0 1px 0 rgb(255 255 255 / .18);
  color: #9fe8b0;
  font-family: "Share Tech Mono", ui-monospace, Menlo, monospace;
  text-shadow: 0 0 6px rgb(120 255 160 / .35);
  display: grid; gap: .6cqh;
  min-width: 0;
}
.lcd-top { display: flex; justify-content: space-between; gap: 3cqw; font-size: 3.6cqw; letter-spacing: .08em; opacity: .75; text-transform: uppercase; }
.lcd-top span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.lcd-title { overflow: hidden; white-space: nowrap; font-size: 5.6cqw; line-height: 1.35; }
.lcd-title span { display: inline-block; padding-right: 2em; }
.lcd-title.scroll span { animation: marquee var(--marquee-dur, 10s) linear infinite; }
@keyframes marquee { 0%, 12% { transform: translateX(0); } 100% { transform: translateX(var(--marquee-shift, -50%)); } }
@media (prefers-reduced-motion: reduce) { .lcd-title.scroll span { animation: none; } .lcd-title { text-overflow: ellipsis; } }
.wordmark {
  font-family: var(--round);
  font-weight: 700;
  font-size: 13cqw;
  letter-spacing: .01em;
  color: var(--silver);
  text-shadow: 0 1px 0 rgb(255 255 255 / .2), 0 -1px 0 rgb(0 0 0 / .3);
  margin: 0 0 6cqh 8cqw;
}

.strip {
  background: linear-gradient(90deg, var(--silver-lo) 0%, var(--silver-hi) 35%, var(--silver) 70%, var(--silver-lo) 100%);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 4.5%;
  container-type: inline-size;
}
.btn {
  appearance: none; border: 0; padding: 0; cursor: pointer;
  width: 68cqw; aspect-ratio: 1; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, var(--orange-hi), var(--orange) 55%, var(--orange-lo));
  box-shadow: 0 4px 0 var(--orange-lo), 0 6px 10px rgb(0 0 0 / .3), inset 0 1px 0 rgb(255 255 255 / .4);
  display: grid; place-items: center;
  transition: transform .08s, box-shadow .08s;
  touch-action: manipulation;
}
.btn svg { width: 42%; fill: #fff4e6; filter: drop-shadow(0 1px 0 rgb(0 0 0 / .25)); }
.btn.metal {
  background: radial-gradient(circle at 35% 30%, #eef0f2, var(--silver-hi) 55%, var(--silver-lo));
  box-shadow: 0 4px 0 #6f7781, 0 6px 10px rgb(0 0 0 / .3), inset 0 1px 0 rgb(255 255 255 / .7);
}
.btn.metal svg { fill: #4a525c; filter: drop-shadow(0 1px 0 rgb(255 255 255 / .5)); }
.btn.metal:active, .btn.metal.down { box-shadow: 0 1px 0 #6f7781, 0 2px 4px rgb(0 0 0 / .3), inset 0 1px 0 rgb(255 255 255 / .5); }
.btn:active, .btn.down { transform: translateY(3px); box-shadow: 0 1px 0 var(--orange-lo), 0 2px 4px rgb(0 0 0 / .3), inset 0 1px 0 rgb(255 255 255 / .3); }
.btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
.btn .pause { display: none; }
.playing-btn .play { display: none; }
.playing-btn .pause { display: block; }
.status {
  position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);
}
@media (prefers-reduced-motion: reduce) {
  .playing .reel, .ffwd .reel, .rew .reel { animation-duration: 6s; }
  .cassette { transition: none; }
}
.sheet {
  position: fixed; inset: 0; z-index: 20;
  background: rgb(10 14 20 / .7);
  display: flex; align-items: flex-end; justify-content: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.sheet[hidden] { display: none; }
.panel {
  width: min(420px, 100%); max-height: 80%; overflow: auto;
  background: #222b38; color: #e8edf3;
  border-radius: 18px 18px 0 0;
  padding: 20px 18px calc(20px + env(safe-area-inset-bottom, 0px));
  font: 16px/1.4 system-ui, -apple-system, sans-serif;
  display: grid; gap: 14px;
}
.panel h2 { margin: 0; font-size: 18px; }
.panel label { font-size: 14px; color: var(--silver-hi); }
.panel input[type=text] { font: inherit; padding: 11px 12px; border-radius: 10px; border: 1px solid #4a5566; background: #161d27; color: #fff; width: 100%; box-sizing: border-box; }
.panel .row { display: flex; gap: 10px; }
.panel button { font: inherit; padding: 12px 14px; border: 0; border-radius: 10px; cursor: pointer; }
.primary { background: var(--orange); color: #fff; font-weight: 600; flex: 1; }
.ghost { background: #333e4d; color: #e8edf3; }
.tapes { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.tapes li { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: #2b3545; border-radius: 10px; }
.tapes li.current { box-shadow: inset 0 0 0 2px var(--orange); }
.tapes .t { flex: 1; min-width: 0; }
.tapes .t b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tapes .t small { color: #9aa6b5; }
.tapes button { padding: 6px 10px; font-size: 14px; background: #3a4556; color: #ffb38a; }
.sp-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: #1f3328; border-radius: 10px; }
.sp-row .t { flex: 1; min-width: 0; }
.sp-row .t b { display: block; }
.sp-row .t small { color: #9fc9ad; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sp-btn { background: #1ed760; color: #08210f; font-weight: 600; }
.sp-btn.off { background: #3a4556; color: #e8edf3; font-weight: 400; }
.sp-btn[hidden] { display: none; }
.tapes small.sp { color: #6fdc95; }
.note a { color: #fff; font-weight: 600; }
.note { margin: 0; padding: 10px 12px; border-radius: 10px; background: rgb(240 138 36 / .15); color: #ffc58a; font-size: 14px; }
.note[hidden] { display: none; }
.hint { margin: 0; font-size: 13px; color: #9aa6b5; }
</style>

<main class="player" aria-label="Cassette player">
  <section class="shell">
    <div></div>
    <div class="brand">CASSETTE</div>
    <div class="bay">
      <div class="cassette" id="cassette" role="button" tabindex="0" aria-label="Manage tapes">
        <div class="label"><span id="tape-name">No tape</span></div>
        <div class="body">
          <div class="reel"><i></i><i></i><i></i><i></i><i></i><i></i></div>
          <div class="window"></div>
          <div class="reel"><i></i><i></i><i></i><i></i><i></i><i></i></div>
        </div>
      </div>
      <div class="door" aria-hidden="true">
        <svg viewBox="0 0 40 60" fill="none" stroke-width="2.4" stroke-linejoin="round">
          <path class="lip" d="M20 4 L36 24 H27 V56 H13 V24 H4 Z"/>
          <path class="groove" d="M20 4 L36 24 H27 V56 H13 V24 H4 Z"/>
        </svg>
      </div>
    </div>
    <div class="lcd" aria-live="polite">
      <div class="lcd-top"><span id="lcd-tape">NO TAPE</span><span id="lcd-count"></span></div>
      <div class="lcd-title"><span id="track-name">Tap the tape to add songs</span></div>
    </div>
    <div class="wordmark">STEREO</div>
  </section>

  <section class="strip" aria-label="Controls">
    <button class="btn metal" id="play" aria-label="Play">
      <svg class="play" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z"/></svg>
      <svg class="pause" viewBox="0 0 24 24"><path d="M6 4h4.5v16H6zM13.5 4H18v16h-4.5z"/></svg>
    </button>
    <button class="btn metal" id="fwd" aria-label="Next song">
      <svg viewBox="0 0 24 24"><path d="M2 5v14l10-7zM12 5v14l10-7z"/></svg>
    </button>
    <button class="btn metal" id="rew" aria-label="Previous song">
      <svg viewBox="0 0 24 24"><path d="M22 5v14l-10-7zM12 5v14L2 12z"/></svg>
    </button>
    <button class="btn" id="eject" aria-label="Change tape (next playlist)">
      <svg viewBox="0 0 24 24"><path d="M12 4l9 10H3zM3 17h18v3H3z"/></svg>
    </button>
  </section>
  <p class="status" id="status" aria-live="polite">Stopped</p>
</main>

<audio id="audio" preload="auto" playsinline></audio>

<div class="sheet" id="sheet" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <h2 id="sheet-title">Your tapes</h2>
    <p class="note" id="sheet-note" hidden></p>
    <div class="sp-row">
      <div class="t"><b>Spotify</b><small id="sp-status">Not connected</small></div>
      <button class="sp-btn" id="sp-connect">Connect</button>
    </div>
    <ul class="tapes" id="tape-list"></ul>
    <label for="new-name">New tape name</label>
    <input id="new-name" type="text" placeholder="e.g. Night drive" autocomplete="off">
    <input id="files" type="file" accept="audio/*,.mp3,.m4a,.aac,.wav,.flac" multiple hidden>
    <div class="row">
      <button class="primary" id="pick">Choose songs</button>
      <button class="ghost" id="close">Close</button>
    </div>
    <p class="hint">Songs are saved on this phone only. Pick several files at once to make one tape. Songs play in file-name order.</p>
  </div>
</div>

<script>
/* Spotify app Client ID from developer.spotify.com/dashboard. It is not a secret. */
const SPOTIFY_CLIENT_ID = '';

(() => {
  const $ = id => document.getElementById(id);
  const cassette = $('cassette'), play = $('play'), status = $('status'), audio = $('audio');
  const tapeName = $('tape-name'), trackName = $('track-name');
  let localTapes = [], spTapes = [], tapes = [], tape = 0, track = 0, busy = false, url = null;
  const ls = {
    get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
    set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };
  const wait = ms => new Promise(r => setTimeout(r, ms));

  /* ---------- storage: my own song files live in IndexedDB on this device ---------- */
  let dbp = null;
  function db() {
    return dbp ||= new Promise((res, rej) => {
      const r = indexedDB.open('cassette', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('tapes', { keyPath: 'id' });
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
  }
  async function store(mode, fn) {
    const d = await db();
    return new Promise((res, rej) => {
      const tx = d.transaction('tapes', mode), st = tx.objectStore('tapes');
      const r = fn(st); tx.oncomplete = () => res(r && r.result); tx.onerror = () => rej(tx.error);
    });
  }
  const loadAll = () => store('readonly', s => s.getAll());
  const save = t => store('readwrite', s => s.put(t));
  const remove = id => store('readwrite', s => s.delete(id));

  /* ---------- Spotify: sign in (PKCE, no server) ---------- */
  const SP_SCOPES = 'user-read-playback-state user-modify-playback-state user-read-currently-playing playlist-read-private playlist-read-collaborative';
  const redirectUri = location.origin + location.pathname;
  const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  async function spLogin() {
    const verifier = b64url(crypto.getRandomValues(new Uint8Array(48)));
    const challenge = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
    const state = b64url(crypto.getRandomValues(new Uint8Array(12)));
    ls.set('sp-pkce', { verifier, state });
    location.href = 'https://accounts.spotify.com/authorize?' + new URLSearchParams({
      response_type: 'code', client_id: SPOTIFY_CLIENT_ID, scope: SP_SCOPES,
      code_challenge_method: 'S256', code_challenge: challenge, redirect_uri: redirectUri, state,
    });
  }
  async function spTokenRequest(params) {
    const r = await fetch('https://accounts.spotify.com/api/token', {
      method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({ client_id: SPOTIFY_CLIENT_ID, ...params }),
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error_description || j.error || 'Spotify sign-in failed');
    const old = ls.get('sp-token') || {};
    const tok = { access: j.access_token, refresh: j.refresh_token || old.refresh, exp: Date.now() + j.expires_in * 1000 };
    ls.set('sp-token', tok);
    return tok;
  }
  async function spHandleRedirect() {
    const q = new URLSearchParams(location.search);
    if (!q.has('code') && !q.has('error')) return;
    history.replaceState(null, '', location.pathname);
    const pk = ls.get('sp-pkce'); ls.set('sp-pkce', null);
    if (q.get('error')) throw new Error('Spotify sign-in was cancelled');
    if (!pk || pk.state !== q.get('state')) throw new Error('Sign-in got lost on the way back. Tap Connect again.');
    await spTokenRequest({ grant_type: 'authorization_code', code: q.get('code'), redirect_uri: redirectUri, code_verifier: pk.verifier });
    return true;
  }
  async function spAccess() {
    const t = ls.get('sp-token');
    if (!t) return null;
    if (t.exp - Date.now() > 60000) return t.access;
    try { return (await spTokenRequest({ grant_type: 'refresh_token', refresh_token: t.refresh })).access; }
    catch { ls.set('sp-token', null); return null; }
  }
  const spConnected = () => !!ls.get('sp-token');
  async function spApi(path, opts = {}, retried) {
    const access = await spAccess();
    if (!access) throw Object.assign(new Error('Not connected to Spotify'), { code: 'AUTH' });
    const r = await fetch('https://api.spotify.com/v1' + path, {
      ...opts, headers: { Authorization: 'Bearer ' + access, ...(opts.body ? { 'Content-Type': 'application/json' } : {}) },
    });
    if (r.status === 401 && !retried) { const t = ls.get('sp-token'); if (t) ls.set('sp-token', { ...t, exp: 0 }); return spApi(path, opts, true); }
    if (r.status === 204 || r.status === 202) return null;
    const j = await r.json().catch(() => null);
    if (!r.ok) {
      const reason = j && j.error && (j.error.reason || j.error.message);
      throw Object.assign(new Error(reason || 'Spotify error ' + r.status), { code: r.status === 404 && /device/i.test(reason || '') ? 'NO_DEVICE' : r.status });
    }
    return j;
  }

  /* ---------- Spotify: playlists become tapes, the Spotify app plays them ---------- */
  const sp = { playing: false, title: '', artist: '', context: null, device: null };
  async function spLoadTapes() {
    const out = [];
    let path = '/me/playlists?limit=50';
    for (let page = 0; path && page < 4; page++) {
      const j = await spApi(path);
      for (const pl of j.items || []) if (pl) out.push({ kind: 'spotify', id: pl.id, name: pl.name, uri: pl.uri, total: pl.tracks ? pl.tracks.total : 0 });
      path = j.next ? j.next.replace('https://api.spotify.com/v1', '') : null;
    }
    ls.set('sp-tapes', out);
    return out;
  }
  async function spDevice() {  // the phone's Spotify app (or whatever device is active)
    const j = await spApi('/me/player/devices');
    const list = (j && j.devices) || [];
    const d = list.find(x => x.is_active) || list.find(x => x.type === 'Smartphone') || list[0];
    if (!d) throw Object.assign(new Error('Open the Spotify app first'), { code: 'NO_DEVICE' });
    return d.id;
  }
  async function spPlay(t, fromStart) {
    const device = await spDevice();
    const same = sp.context === t.uri && !fromStart;
    await spApi('/me/player/play?device_id=' + encodeURIComponent(device), {
      method: 'PUT', body: same ? undefined : JSON.stringify({ context_uri: t.uri, offset: { position: 0 } }),
    });
    sp.playing = true; sp.context = t.uri;
    show(true); spPollSoon();
  }
  async function spPause() { await spApi('/me/player/pause', { method: 'PUT' }); sp.playing = false; show(false); }
  async function spSkip(dir) { await spApi('/me/player/' + (dir > 0 ? 'next' : 'previous'), { method: 'POST' }); spPollSoon(); }
  async function spRefresh() {
    const j = await spApi('/me/player/currently-playing');
    if (!j || !j.item) { sp.playing = false; sp.title = ''; sp.artist = ''; }
    else {
      sp.playing = !!j.is_playing;
      sp.title = j.item.name;
      sp.artist = (j.item.artists || []).map(a => a.name).join(', ');
      sp.context = j.context ? j.context.uri : null;
    }
    if (isSp()) show(sp.playing);
  }
  let pollTimer = null;
  function spPollSoon() { clearTimeout(pollTimer); pollTimer = setTimeout(spPoll, 700); }
  async function spPoll() {
    clearTimeout(pollTimer);
    if (isSp() && spConnected() && !document.hidden) { try { await spRefresh(); } catch {} }
    pollTimer = setTimeout(spPoll, 4000);
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) spPollSoon(); });
  function spError(e) {
    if (e.code === 'NO_DEVICE') {
      setTitle('Open the Spotify app first');
      openSheet('Spotify needs to be open on this phone to play. <a href="https://open.spotify.com/">Open Spotify</a>, then come back and press play.', true);
    } else if (e.code === 'AUTH') {
      openSheet('Connect Spotify again to play this tape.');
    } else if (e.code === 403) {
      openSheet('Spotify said no: ' + e.message + '. Playback control needs Spotify Premium.');
    } else {
      setTitle(e.message);
    }
  }

  /* ---------- player ---------- */
  const isSp = () => !!(tapes[tape] && tapes[tape].kind === 'spotify');
  const cur = () => !isSp() && tapes[tape] && tapes[tape].tracks[track];
  const isPlaying = () => isSp() ? sp.playing : !audio.paused;
  function rebuild() { tapes = [...localTapes, ...spTapes]; if (tape >= tapes.length) tape = 0; }
  function render() {
    const t = tapes[tape], s = cur();
    cassette.classList.toggle('empty', !t);
    tapeName.textContent = t ? t.name : 'No tape';
    $('lcd-tape').textContent = t ? t.name : 'No tape';
    if (isSp()) {
      $('lcd-count').textContent = 'SPOTIFY';
      setTitle(sp.context === t.uri && sp.title ? sp.title + (sp.artist ? ' · ' + sp.artist : '') : 'Press play');
      status.textContent = (sp.playing ? 'Playing ' : 'Paused ') + t.name + ' on Spotify';
      return;
    }
    $('lcd-count').textContent = t ? (track + 1) + '/' + t.tracks.length : '';
    setTitle(s ? s.name : 'Tap the tape to add songs');
    status.textContent = s ? (audio.paused ? 'Paused ' : 'Playing ') + s.name : 'No tape loaded';
  }
  function setTitle(text) {  // scroll long titles across the LCD so the whole name can be read
    const box = trackName.parentElement;
    if (trackName.textContent === text && box.dataset.done) return;
    trackName.textContent = text;
    box.classList.remove('scroll');
    requestAnimationFrame(() => {
      const over = trackName.scrollWidth - parseFloat(getComputedStyle(trackName).paddingRight) - box.clientWidth;
      if (over > 2) {
        box.style.setProperty('--marquee-shift', -over - 16 + 'px');
        box.style.setProperty('--marquee-dur', Math.max(5, over / 30) + 's');
        box.classList.add('scroll');
      }
      box.dataset.done = '1';
    });
  }
  function show(playing) {
    cassette.classList.toggle('playing', playing);
    play.classList.toggle('playing-btn', playing);
    play.setAttribute('aria-label', playing ? 'Pause' : 'Play');
    render();
  }
  function cue(autoplay) {
    const s = cur();
    if (url) { URL.revokeObjectURL(url); url = null; }
    if (!s) { audio.removeAttribute('src'); audio.load(); show(isSp() && sp.playing && sp.context === tapes[tape].uri); return; }
    url = URL.createObjectURL(s.blob);
    audio.src = url;
    if ('mediaSession' in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({ title: s.name, album: tapes[tape].name, artist: 'Cassette' });
    }
    if (autoplay) audio.play().catch(() => show(false)); else show(false);
    render();
  }
  function whirr(cls) { cassette.classList.add(cls); setTimeout(() => cassette.classList.remove(cls), 450); }
  function step(dir, cls) {
    const t = tapes[tape]; if (!t || busy) return;
    whirr(cls);
    if (isSp()) { spSkip(dir).catch(spError); return; }
    const playing = !audio.paused;
    track = (track + dir + t.tracks.length) % t.tracks.length;
    cue(playing);
  }
  const next = () => step(1, 'ffwd'), prev = () => step(-1, 'rew');
  function toggle() {
    if (busy) return;
    if (!tapes[tape]) return openSheet();
    if (isSp()) { (sp.playing ? spPause() : spPlay(tapes[tape])).catch(spError); return; }
    audio.paused ? audio.play().catch(() => {}) : audio.pause();
  }

  audio.addEventListener('play', () => show(true));
  audio.addEventListener('pause', () => { if (!isSp()) show(false); });
  audio.addEventListener('ended', () => {
    const t = tapes[tape];
    if (track < t.tracks.length - 1) { track++; cue(true); }
    else { track = 0; cue(false); }  // end of side: stop and rewind, like a real tape
  });
  if ('mediaSession' in navigator) {  // lock screen and Control Center buttons (own files)
    const ms = navigator.mediaSession;
    ms.setActionHandler('play', toggle); ms.setActionHandler('pause', toggle);
    ms.setActionHandler('nexttrack', next); ms.setActionHandler('previoustrack', prev);
  }

  play.addEventListener('click', toggle);
  $('fwd').addEventListener('click', next);
  $('rew').addEventListener('click', prev);
  $('eject').addEventListener('click', async () => {
    if (busy) return;
    if (!tapes.length) { openSheet(); return; }
    busy = true;
    const wasPlaying = isPlaying(), wasSp = isSp();
    audio.pause();
    cassette.classList.add('out');
    await wait(550);
    if (tapes.length < 2) {  // only one tape: put it back and offer to add another
      cassette.classList.remove('out');
      await wait(500);
      busy = false;
      openSheet('Add another tape so eject can switch between them.');
      return;
    }
    tape = (tape + 1) % tapes.length; track = 0;
    cue(false);
    cassette.classList.remove('out');
    await wait(500);
    busy = false;
    if (wasPlaying) {
      if (isSp()) spPlay(tapes[tape], true).catch(spError);
      else { if (wasSp) spPause().catch(() => {}); audio.play().catch(() => {}); }
    }
  });

  /* ---------- tape manager sheet ---------- */
  function openSheet(note, html) {
    renderList();
    const n = $('sheet-note');
    html ? (n.innerHTML = note || '') : (n.textContent = note || '');
    n.hidden = !note;
    $('sheet').hidden = false;
  }
  function closeSheet() { $('sheet').hidden = true; }
  cassette.addEventListener('click', () => { if (!busy) openSheet(); });
  cassette.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openSheet(); } });
  $('close').addEventListener('click', closeSheet);
  $('sheet').addEventListener('click', e => { if (e.target === $('sheet')) closeSheet(); });
  $('pick').addEventListener('click', () => $('files').click());

  function renderSp() {
    const btn = $('sp-connect'), st = $('sp-status');
    if (!SPOTIFY_CLIENT_ID) { st.textContent = 'Not set up yet'; btn.hidden = true; return; }
    btn.hidden = false;
    if (spConnected()) { st.textContent = 'Connected · ' + spTapes.length + ' playlists'; btn.textContent = 'Disconnect'; btn.classList.add('off'); }
    else { st.textContent = 'Play your playlists through the Spotify app'; btn.textContent = 'Connect'; btn.classList.remove('off'); }
  }
  $('sp-connect').addEventListener('click', async () => {
    if (!spConnected()) return spLogin();
    const btn = $('sp-connect');
    if (btn.dataset.armed !== '1') { btn.dataset.armed = '1'; btn.textContent = 'Tap again'; return; }
    btn.dataset.armed = '';
    ls.set('sp-token', null); ls.set('sp-tapes', null);
    spTapes = []; sp.playing = false; rebuild(); cue(false); renderList();
  });

  function renderList() {
    renderSp();
    const ul = $('tape-list'); ul.textContent = '';
    if (!tapes.length) { const li = document.createElement('li'); li.textContent = 'No tapes yet. Choose songs or connect Spotify to make your first one.'; ul.append(li); return; }
    tapes.forEach((t, i) => {
      const li = document.createElement('li'); if (i === tape) li.className = 'current';
      const d = document.createElement('div'); d.className = 't';
      const b = document.createElement('b'); b.textContent = t.name;
      const sm = document.createElement('small');
      if (t.kind === 'spotify') { sm.className = 'sp'; sm.textContent = 'Spotify · ' + t.total + ' songs'; }
      else sm.textContent = t.tracks.length + ' songs';
      d.append(b, sm);
      d.style.cursor = 'pointer';
      d.addEventListener('click', () => { if (busy) return; if (isSp() && sp.playing) spPause().catch(() => {}); audio.pause(); tape = i; track = 0; cue(false); closeSheet(); });
      li.append(d);
      if (t.kind !== 'spotify') {
        const del = document.createElement('button'); del.textContent = 'Remove';
        del.setAttribute('aria-label', 'Remove ' + t.name);
        del.addEventListener('click', async () => {
          if (del.dataset.armed !== '1') { del.dataset.armed = '1'; del.textContent = 'Tap again'; return; }
          await remove(t.id);
          localTapes = localTapes.filter(x => x.id !== t.id);
          const removingCurrent = i === tape;
          rebuild();
          if (removingCurrent) { tape = 0; track = 0; audio.pause(); cue(false); } else if (i < tape) tape--;
          renderList();
        });
        li.append(del);
      }
      ul.append(li);
    });
  }

  $('files').addEventListener('change', async e => {
    const files = [...e.target.files].filter(f => f.type.startsWith('audio/') || /\.(mp3|m4a|aac|wav|flac|ogg)$/i.test(f.name));
    e.target.value = '';
    if (!files.length) return;
    files.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
    const t = {
      id: Date.now().toString(36),
      name: $('new-name').value.trim() || 'Tape ' + (localTapes.length + 1),
      created: Date.now(),
      tracks: files.map(f => ({ name: f.name.replace(/\.[^.]+$/, ''), blob: f })),
    };
    try { await save(t); } catch (err) { $('sheet-title').textContent = 'Could not save. The phone may be out of space.'; return; }
    localTapes.push(t); $('new-name').value = '';
    rebuild();
    tape = localTapes.length - 1; track = 0; audio.pause(); cue(false);
    renderList();
  });

  /* ---------- start ---------- */
  (async () => {
    try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {}
    try { localTapes = (await loadAll()).sort((a, b) => a.created - b.created); } catch { localTapes = []; }
    let note = null, justConnected = false;
    try { justConnected = await spHandleRedirect(); } catch (e) { note = e.message; }
    if (spConnected()) spTapes = ls.get('sp-tapes') || [];
    rebuild(); cue(false);
    if (note) openSheet(note);
    if (spConnected()) {
      try {
        spTapes = await spLoadTapes(); rebuild(); cue(false);
        if (justConnected) { tape = localTapes.length; track = 0; cue(false); openSheet('Spotify connected. Your playlists are now tapes. Keep the Spotify app open while you listen.'); }
        else if (!$('sheet').hidden) renderList();
      } catch (e) { if (e.code === 'AUTH') { spTapes = []; rebuild(); cue(false); } }
      spPoll();
    }
  })();
})();
</script>
